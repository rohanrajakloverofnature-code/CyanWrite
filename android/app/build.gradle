plugins { id 'com.android.application' }

android { namespace 'app.cyanwrite'; compileSdk 35
    defaultConfig { applicationId 'app.cyanwrite'; minSdk 23; targetSdk 35; versionCode 9; versionName '1.2.4' }
    buildTypes { release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    sourceSets { main { assets.srcDir(file("${projectDir}/../../web")) } }
    testOptions { unitTests.includeAndroidResources = true }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

configurations.configureEach {
    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22',
        'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22',
        'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
}
